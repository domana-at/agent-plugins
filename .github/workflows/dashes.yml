name: Dashes

# Own workflow on purpose: ci.yml skips Markdown and docs/, and that is
# where most prose lives. No install, runs in seconds.
# Rule: wiki/Design/design-system.md section 10.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashes:
    # Public repo: the self-hosted runner group does not serve it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No em or en dashes
        run: node scripts/check-dashes.mjs
